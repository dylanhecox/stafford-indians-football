<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Stafford Indians Players Directory</title>

<style>

    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h1 {
        margin-bottom: 15px;
    }

    table {
        border-collapse: collapse;
        width: auto;
        display: inline-table;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 6px 10px;
        white-space: nowrap;
    }

    th {
        background-color: #f2f2f2;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s ease;
    }

    th:hover {
        background-color: #dcdcdc;
    }

    td:first-child,
    th:first-child {
        text-align: left;
    }

    td:nth-child(3),
    th:nth-child(3),
    td:nth-child(4),
    th:nth-child(4),
    td:last-child,
    th:last-child {
        text-align: center;
    }

    a {
        text-decoration: none;
        color: blue;
    }

    a:hover {
        text-decoration: underline;
    }

</style>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="nav.js"></script>

</head>

<body>

<div id="breadcrumb" style="margin-bottom: 10px; font-size: 14px;"></div>

<h1>Stafford Indians Players Directory</h1>

<table id="playersTable">

<thead>

    <tr>
        <th>Player</th>
        <th>Seasons</th>
        <th>Height</th>
        <th>Weight</th>
        <th>No.</th>
    </tr>

</thead>

<tbody></tbody>

</table>

<script>

fetch("Master_PlayerList.csv")

.then(response => response.text())

.then(csv => {

    const playerData = Papa.parse(csv, {
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.trim().toLowerCase()
    }).data;

    const players = {};

    // ================= MASTER PLAYER LIST =================

    playerData.forEach(row => {

        const name = (row.player || "").trim();
        const playerId = (row.player_id || "").trim();
        const season = Number(row.season);

        if (!name || !playerId || !season) return;

        if (!players[playerId]) {

            players[playerId] = {
                name: name,
                seasons: [],
                records: []
            };

        }

        players[playerId].seasons.push(season);

        players[playerId].records.push({
            season: season,
            position: (row.position || "").trim(),
            height: (row.height || "").trim(),
            weight: (row.weight || "").trim(),
            number: (row["jersey number"] || row.jersey_number || row.number || "").trim(),
            class: (row.class || "").trim().toLowerCase()
        });

    });

    // ================= HELPER FUNCTION =================

    function getDisplayInfo(records) {

        if (!records.length) {
            return {
                height: "",
                weight: "",
                number: ""
            };
        }

        /*
         * First preference:
         * Senior year.
         *
         * If there is no Senior year:
         * use the latest available season.
         */

        const seniorRecords = records
            .filter(r => r.class === "senior")
            .sort((a, b) => b.season - a.season);

        const latestRecords = [...records]
            .sort((a, b) => b.season - a.season);

        const preferredRecords =
            seniorRecords.length > 0
                ? seniorRecords
                : latestRecords;

        /*
         * For each field, use the preferred record first.
         * If that field is blank, fall back through the
         * player's other records from newest to oldest.
         */

        function getField(field) {

            for (const record of preferredRecords) {
                if (record[field]) {
                    return record[field];
                }
            }

            for (const record of latestRecords) {
                if (record[field]) {
                    return record[field];
                }
            }

            return "";
        }

        return {
            height: getField("height"),
            weight: getField("weight"),
            number: getField("number")
        };

    }

    // ================= BUILD TABLE =================

    const tbody = document.querySelector("#playersTable tbody");

    Object.entries(players).forEach(([playerId, p]) => {

        const years = [...new Set(p.seasons)]
            .map(Number)
            .sort((a, b) => a - b);

        const firstYear = years[0];
        const lastYear = years[years.length - 1];

        const seasonRange =
            firstYear === lastYear
                ? `${firstYear}`
                : `${firstYear}-${lastYear}`;

        const displayInfo = getDisplayInfo(p.records);

        const tr = document.createElement("tr");

        tr.dataset.playerid = playerId;
        tr.dataset.firstyear = firstYear;
        tr.dataset.lastyear = lastYear;
        tr.dataset.height = displayInfo.height;
        tr.dataset.weight = displayInfo.weight;
        tr.dataset.number = displayInfo.number;

        tr.innerHTML = `

            <td>
                <a href="player.html?player_id=${playerId}">
                    ${p.name}
                </a>
            </td>

            <td>${seasonRange}</td>

            <td>${displayInfo.height}</td>

            <td>${displayInfo.weight}</td>

            <td>${displayInfo.number}</td>

        `;

        tbody.appendChild(tr);

    });

    // ================= SORTING =================

    const table = document.getElementById("playersTable");
    const headers = table.querySelectorAll("thead th");

    let sortState = {};

    function sortPlayersTable(colIndex, asc) {

        const rows = Array.from(tbody.querySelectorAll("tr"));

        const dir = asc ? 1 : -1;

        rows.sort((a, b) => {

// PLAYER COLUMN
if (colIndex === 0) {
    const aId = a.dataset.playerid;
    const bId = b.dataset.playerid;

    const aUndetermined = aId === "undetermined_14" || aId === "undetermined_33";
const bUndetermined = bId === "undetermined_14" || bId === "undetermined_33";

    if (aUndetermined && !bUndetermined) return 1;
    if (!aUndetermined && bUndetermined) return -1;

    return aId.localeCompare(bId) * dir;
}
            // SEASONS COLUMN
            if (colIndex === 1) {

                const aYear = Number(a.dataset.lastyear);
                const bYear = Number(b.dataset.lastyear);

                return (aYear - bYear) * dir;

            }

// HEIGHT COLUMN
if (colIndex === 2) {
    function heightInches(value) {
        const match = value.match(/^(\d+)'(?:\s*(\d+(?:\.\d+)?)\s*"?\s*)?$/);

        if (!match) return -1;

        const feet = Number(match[1]);
        const inches = match[2] ? Number(match[2]) : 0;

        return feet * 12 + inches;
    }

    const aHeight = heightInches(a.dataset.height);
    const bHeight = heightInches(b.dataset.height);

    return (aHeight - bHeight) * dir;
}

            // WEIGHT COLUMN
            if (colIndex === 3) {

                const aWeight = parseFloat(a.dataset.weight);
                const bWeight = parseFloat(b.dataset.weight);

                const aValue = Number.isNaN(aWeight) ? -1 : aWeight;
                const bValue = Number.isNaN(bWeight) ? -1 : bWeight;

                return (aValue - bValue) * dir;

            }

            // NUMBER COLUMN
            if (colIndex === 4) {

                const aNumber = parseInt(a.dataset.number);
                const bNumber = parseInt(b.dataset.number);

                const aValue = Number.isNaN(aNumber) ? -1 : aNumber;
                const bValue = Number.isNaN(bNumber) ? -1 : bNumber;

                return (aValue - bValue) * dir;

            }

            return 0;

        });

        rows.forEach(row => tbody.appendChild(row));

    }

    headers.forEach((th, i) => {

        sortState[i] = true;

        th.addEventListener("click", () => {

            sortPlayersTable(i, sortState[i]);

            sortState[i] = !sortState[i];

        });

    });

    // DEFAULT SORT = PLAYER_ID ALPHABETICALLY

    sortPlayersTable(0, true);

})

.catch(error => {

    console.error("Error loading Master_PlayerList.csv:", error);

});


// ================= BREADCRUMB =================

renderBreadcrumb([

    { label: "Stafford Indians", link: "index.html" },

    { label: "Players" }

]);

</script>

</body>

</html>
